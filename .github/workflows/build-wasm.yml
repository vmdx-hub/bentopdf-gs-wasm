name: Build Ghostscript WASM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: emscripten/emsdk:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone GhostPDL
        run: |
          rm -rf ghostpdl
          git clone --depth 1 https://github.com/ArtifexSoftware/ghostpdl.git ghostpdl

      - name: Make build script executable
        run: |
          chmod +x build_scripts/build.sh

      - name: Build Ghostscript WASM
        run: |
          ./build_scripts/build.sh

      - name: Show build output
        run: |
          echo "=== dist ==="
          ls -lah dist

          echo "=== Ghostscript JS ==="
          ls -lh dist/gs.js

          echo "=== Ghostscript WASM ==="
          ls -lh dist/gs.wasm

      - name: Upload build result
        uses: actions/upload-artifact@v4
        with:
          name: ghostscript-wasm
          path: |
            dist/gs.js
            dist/gs.wasm
          if-no-files-found: error
